<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Production Atlas checks</title><style>body{font:14px Consolas,monospace;max-width:850px;margin:40px auto;padding:20px;background:#f4f3ec;color:#23342f}pre{white-space:pre-wrap;line-height:1.8}.pass{color:#32654d}.fail{color:#a12626}a{color:inherit}</style></head><body><a href="index.html">← Open atlas</a><h1>Offline calculation checks</h1><pre id="results">Running…</pre><script src="data.js"></script><script src="engine.js"></script><script>
'use strict';
const results = [], E = ProductionEngine.create(ATLAS_DATA);
let passed = 0, failed = 0;
function check(label, fn) { try { if (!fn()) throw new Error('Assertion failed'); results.push('PASS  ' + label); passed++; } catch (e) { results.push('FAIL  ' + label + ': ' + e.message); failed++; } }
const near = (a, b) => Math.abs(a - b) < 1e-8;
check('19 station profiles, 239 modeled recipe attachments', () => ATLAS_DATA.stations.length === 19 && ATLAS_DATA.stations.reduce((n, s) => n + s.recipes.length, 0) === 239);
check('All recipe and category references resolve', () => { const ids = new Set(ATLAS_DATA.categories.map(c => c.id)); return ATLAS_DATA.stations.every(s => s.recipes.every(id => E.recipes.has(id))) && ATLAS_DATA.recipes.every(r => r.inputs.every(i => ids.has(i.category)) && (!r.output || ids.has(r.output.category))); });
check('VORB industrial products: gross 3/h, net 3/h', () => { const x = E.outputs('VORB', 'surplus').find(x => x.category === 'AnyIndustrialProducts'); return near(x.rate, 3) && near(x.gross, 3) && near(x.consumed, 0); });
check('OKLG consumes 1 industrial product/hour after exclusion', () => near(E.totals.get('OKLG').get('AnyIndustrialProducts').input, 1));
check('Ignored HVAC recipe absent; one Control Systems branch', () => !E.recipes.has('OKLGIndustrialProductsToHVACConverter') && E.routes('VORB','AnyIndustrialProducts',68).find(r=>r.station.id==='OKLG').outcomes.filter(o=>o.recipe.output.category==='AnyControlSystems').length===1);
check('Multi-unit source: JATL water produces 10/h', () => near(E.recipes.get('JATLWaterProducer').cyclesPerHour * E.recipes.get('JATLWaterProducer').output.amount, 10));
check('Slow recipe processes the entire shipment over time', () => { const o=E.outcome(E.recipes.get('OKLGIndustrialProductsToControlSystemsConverter'),'AnyIndustrialProducts',100); return o.used===100 && o.outputRate===100 && o.hours===200; });
check('Whole cycles leave unusable remainder', () => { const o=E.outcome(E.recipes.get('MTRSMetalsAndIndustrialProductsAndToolsToFusionPartsConverter'),'AnyIndustrialProducts',5);return o.cycles===2 && o.used===4 && o.remaining===1 && o.outputRate===6 && o.coInputs.find(i=>i.category==='AnyMetal').rate===20 && o.coInputs.find(i=>i.category==='AnyTools').rate===4; });
check('Two-leg finite shipment: 100 industrial → 300 plastics → 1200 electronics',()=>{const a=E.outcome(E.recipes.get('VNCAIndustrialProductsToPlasticsConverter'),'AnyIndustrialProducts',100);const b=E.outcome(E.recipes.get('MSUZPlasticsAndMetalsToElectronicsConverter'),'AnyPlastics',a.outputRate);return a.outputRate===300 && b.outputRate===1200 && b.coInputs[0].rate===300;});
check('Pods pack whole units separately per 1000 kg',()=>E.shipment('pods',3,300)===9);
check('Units mode does not need mass',()=>E.shipment('units',123,null)===123);
check('Invalid shipments rejected',()=>[0,-1,1.5,NaN,Infinity,1000001].every(n=>E.shipment('units',n,1)===null)&&E.shipment('pods',1,0)===null);
check('Oversized single unit cannot fit in pod',()=>E.shipment('pods',1,1001)===0);
check('Output pod estimate uses whole units per pod',()=>{const x=E.load('AnyMetal',1001);return x.kg===1001 && x.pods===2;});
check('Every traded category has a positive mass estimate',()=>ATLAS_DATA.recipes.every(r=>r.inputs.every(i=>E.mass(i.category)>0)&&(!r.output||E.mass(r.output.category)>0)));check('Production-only routes omit consumption sinks', () => E.routes('JATL', 'AnyWater', 10).every(r => r.outcomes.every(o => !!o.recipe.output)));
check('Consumption option reveals water-consuming VORB', () => { const base = E.routes('JATL', 'AnyWater', 10); const all = E.routes('JATL', 'AnyWater', 10, { includeSinks: true }); return !base.some(r => r.station.id === 'VORB') && all.some(r => r.station.id === 'VORB' && r.outcomes.some(o => !o.recipe.output)); });
check('Routes exclude departure and respect region filter', () => E.routes('VORB', 'AnyIndustrialProducts', 3, { region: 'Venus' }).every(r => r.station.id !== 'VORB' && r.station.region === 'Venus'));
check('Zero supply shows no producible output', () => E.routes('VORB', 'AnyIndustrialProducts', 0).every(r=>r.outcomes.every(o=>o.used===0 && o.outputRate===0)));
check('Surplus excludes locally overconsumed goods; gross retains them', () => { const station = ATLAS_DATA.stations.find(s => E.outputs(s.id, 'gross').some(o => o.net <= 0)); return !!station && E.outputs(station.id, 'surplus').every(o => o.net > 0) && E.outputs(station.id, 'gross').some(o => o.net <= 0); });
check('Every recipe conserves selected input and scales total co-inputs',()=>ATLAS_DATA.recipes.every(r=>r.inputs.every(i=>[0,1,5,100,9999].every(units=>{const o=E.outcome(r,i.category,units);return o && Number.isInteger(o.cycles) && o.used<=units && near(o.used+o.remaining,units) && o.coInputs.every(c=>near(c.rate,c.amount*o.cycles)) && (!r.output||near(o.outputRate,r.output.amount*o.cycles));}))));const el = document.getElementById('results'); el.textContent = results.join('\n') + '\n\n' + passed + ' passed, ' + failed + ' failed.'; el.className = failed ? 'fail' : 'pass'; document.body.dataset.testResult = failed ? 'fail' : 'pass'; document.title = (failed ? 'FAIL' : 'PASS') + ' — Production Atlas checks';
</script></body></html>
