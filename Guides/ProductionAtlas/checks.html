<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Production Atlas checks</title><style>body{font:14px Consolas,monospace;max-width:850px;margin:40px auto;padding:20px;background:#f4f3ec;color:#23342f}pre{white-space:pre-wrap;line-height:1.8}.pass{color:#32654d}.fail{color:#a12626}a{color:inherit}</style></head><body><a href="index.html">← Open atlas</a><h1>Offline calculation checks</h1><pre id="results">Running…</pre><script src="data.js"></script><script src="engine.js"></script><script>
'use strict';
const results = [], E = ProductionEngine.create(ATLAS_DATA);
let passed = 0, failed = 0;
function check(label, fn) { try { if (!fn()) throw new Error('Assertion failed'); results.push('PASS  ' + label); passed++; } catch (e) { results.push('FAIL  ' + label + ': ' + e.message); failed++; } }
const near = (a, b) => Math.abs(a - b) < 1e-8;
check('19 station profiles, 240 recipe attachments', () => ATLAS_DATA.stations.length === 19 && ATLAS_DATA.stations.reduce((n, s) => n + s.recipes.length, 0) === 240);
check('All recipe and category references resolve', () => { const ids = new Set(ATLAS_DATA.categories.map(c => c.id)); return ATLAS_DATA.stations.every(s => s.recipes.every(id => E.recipes.has(id))) && ATLAS_DATA.recipes.every(r => r.inputs.every(i => ids.has(i.category)) && (!r.output || ids.has(r.output.category))); });
check('VORB industrial products: gross 3/h, net 3/h', () => { const x = E.outputs('VORB', 'surplus').find(x => x.category === 'AnyIndustrialProducts'); return near(x.rate, 3) && near(x.gross, 3) && near(x.consumed, 0); });
check('OKLG consumes 1.5 industrial products/hour', () => near(E.totals.get('OKLG').get('AnyIndustrialProducts').input, 1.5));
check('Misnamed OKLG ToHVAC recipe actually outputs Control Systems', () => E.recipes.get('OKLGIndustrialProductsToHVACConverter').output.category === 'AnyControlSystems');
check('Multi-unit source: JATL water produces 10/h', () => near(E.recipes.get('JATLWaterProducer').cyclesPerHour * E.recipes.get('JATLWaterProducer').output.amount, 10));
check('Recipe-cap limited: 3/h industrial products supports 0.5/h OKLG control systems', () => { const o = E.outcome(E.recipes.get('OKLGIndustrialProductsToControlSystemsConverter'), 'AnyIndustrialProducts', 3); return near(o.used, .5) && near(o.outputRate, .5) && near(o.remaining, 2.5); });
check('Cargo limited: 1/h industrial products yields 3/h VNCA plastics', () => { const o = E.outcome(E.recipes.get('VNCAIndustrialProductsToPlasticsConverter'), 'AnyIndustrialProducts', 1); return near(o.outputRate, 3) && near(o.used, 1); });
check('Co-input amounts scale with cargo-limited cycles', () => { const o = E.outcome(E.recipes.get('MTRSMetalsAndIndustrialProductsAndToolsToFusionPartsConverter'), 'AnyIndustrialProducts', 3); return near(o.outputRate, 4.5) && near(o.coInputs.find(i => i.category === 'AnyMetal').rate, 15) && near(o.coInputs.find(i => i.category === 'AnyTools').rate, 3); });
check('Two-leg propagation: VORB 3/h industrial → VNCA 9/h plastics → MSUZ 9.2/h electronics', () => { const a = E.outcome(E.recipes.get('VNCAIndustrialProductsToPlasticsConverter'), 'AnyIndustrialProducts', 3); const b = E.outcome(E.recipes.get('MSUZPlasticsAndMetalsToElectronicsConverter'), 'AnyPlastics', a.outputRate); return near(a.outputRate, 9) && near(b.outputRate, 9.2) && near(b.coInputs[0].rate, 2.3); });
check('Production-only routes omit consumption sinks', () => E.routes('JATL', 'AnyWater', 10).every(r => r.outcomes.every(o => !!o.recipe.output)));
check('Consumption option reveals water-consuming VORB', () => { const base = E.routes('JATL', 'AnyWater', 10); const all = E.routes('JATL', 'AnyWater', 10, { includeSinks: true }); return !base.some(r => r.station.id === 'VORB') && all.some(r => r.station.id === 'VORB' && r.outcomes.some(o => !o.recipe.output)); });
check('Routes exclude departure and respect region filter', () => E.routes('VORB', 'AnyIndustrialProducts', 3, { region: 'Venus' }).every(r => r.station.id !== 'VORB' && r.station.region === 'Venus'));
check('Zero supply cannot enable recipes', () => E.routes('VORB', 'AnyIndustrialProducts', 0).length === 0);
check('Surplus excludes locally overconsumed goods; gross retains them', () => { const station = ATLAS_DATA.stations.find(s => E.outputs(s.id, 'gross').some(o => o.net <= 0)); return !!station && E.outputs(station.id, 'surplus').every(o => o.net > 0) && E.outputs(station.id, 'gross').some(o => o.net <= 0); });
check('Every possible route respects recipe/input caps and co-input arithmetic', () => ATLAS_DATA.stations.every(s => E.outputs(s.id, 'gross').every(supply => E.routes(s.id, supply.category, supply.rate, { includeSinks: true }).every(route => route.outcomes.every(o => o.cycles <= o.recipe.cyclesPerHour + 1e-8 && o.used <= supply.rate + 1e-8 && near(o.used + o.remaining, supply.rate) && o.coInputs.every(i => near(i.rate, i.amount * o.cycles)))))));
const el = document.getElementById('results'); el.textContent = results.join('\n') + '\n\n' + passed + ' passed, ' + failed + ' failed.'; el.className = failed ? 'fail' : 'pass'; document.body.dataset.testResult = failed ? 'fail' : 'pass'; document.title = (failed ? 'FAIL' : 'PASS') + ' — Production Atlas checks';
</script></body></html>
