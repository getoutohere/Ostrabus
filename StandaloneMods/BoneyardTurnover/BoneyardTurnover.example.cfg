# Boneyard Turnover 0.1.1. BepInEx creates the real CFG on first launch.
# Plugin ID: com.ostrabus.boneyardturnover
# Durations are accumulated in-game days outside the field's ATC region.
# Settings are captured at departure and stored with that absence.

[Turnover]

# Enable turnover. Disabling clears departure tracking.
Enabled = true

# Days away giving an initially eligible wreck a 50% replacement chance.
# Must be finite and greater than zero. Smaller means faster turnover.
HalfLifeDays = 7

# 1: exponential. Below 1: more early turnover, longer tail.
# Above 1: slower early turnover, sharper later rise.
# Must be finite and greater than zero.
CurveShape = 1
